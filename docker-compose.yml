version: "3.7"
services:
  nginx:
    image: nginx:1.23.1
    restart: always
    volumes:
      - ./config/nginx:/etc/nginx/templates
      - .:/code
    ports:
      - "80:80"
      - "443:443"

  web:
    build: .
    command: [
        # "bash",
        # "-c",
        # "chmod +x ./wait-for-it.sh",
        # "&&",
        "./wait-for-it.sh",
        "pg1:5432",
        "--",
        "uwsgi",
        "--ini",
        "/code/config/uwsgi/uwsgi.ini",
      ]

    restart: always
    # ports:
    #   - "8000:8000"
    volumes:
      - .:/code
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod

  daphne:
    build: .
    working_dir: /code/church/
    command:
      [
        "../wait-for-it.sh",
        "pg1:5432",
        "--",
        "daphne",
        "-u",
        "/code/church/daphne.sock",
        "core.asgi:application",
      ]
    restart: always
    volumes:
      - .:/code
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
volumes:
  pg1_data:
